name: Publish release

# Builds and publishes a release. Runs when a release is published, and can be dispatched by hand.
#
#   buildexe           pyinstaller executables: Windows, Ubuntu, macOS x86 and macOS arm64.
#                      Pyinstaller can only build for the OS it runs on, so one job per OS.
#   build_dist         the Python wheel and sdist
#   upload_to_release  attaches the executables to the GitHub release
#   publish_pypi       uploads the wheel and sdist to PyPI
#   test_pypi          manual only (target: test-pypi); uploads the same files to Test PyPI
#
# upload_to_release and publish_pypi both use the `release` environment, which requires a reviewer.
# A reviewer approves the `release` environment once on the run page and both jobs continue.
# Nothing is published until the executables have built: publish_pypi needs buildexe.
# test_pypi has no environment, so it needs no approval.

# reference material:
# https://data-dive.com/multi-os-deployment-in-cloud-using-pyinstaller-and-github-actions
# https://anshumanfauzdar.medium.com/using-github-actions-to-bundle-python-application-into-a-single-package-and-automatic-release-834bd42e0670

on:
  release:
    types: [published]
  # Manual path: publish without a release (target: pypi or test-pypi), or repair a published
  # release (target: binaries). The release tag is resolved from the release event, then
  # inputs.release_tag, then github.ref_name when dispatched at a tag ref. Don't dispatch for a
  # draft release: the upload step finds the release by tag, drafts can't be found that way, and
  # the action then creates a second release for the same tag.
  # There is deliberately no `push: tags` trigger: release-on-merge.yml pushes a
  # tag on every merge to main, and a build should only run once a release is published.
  workflow_dispatch:
    inputs:
      target:
        description: 'What to run: all (executables and PyPI), binaries (re-attach executables), pypi, or test-pypi (Test PyPI, no approval)'
        required: true
        type: choice
        default: all
        options:
          - all
          - binaries
          - pypi
          - test-pypi
      release_tag:
        description: 'Release tag to attach binaries to. Required for all or binaries when dispatching from a branch rather than a tag ref.'
        required: false
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:

  buildexe:
    name: Build executables
    if: ${{ github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'binaries' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            TARGET: windows
            CMD_BUILD: >
              pyinstaller tabcmd-windows.spec --clean --noconfirm --distpath ./dist/windows
            UPLOAD_FILE_NAME: tabcmd.exe
            OUT_FILE_NAME: tabcmd.exe
            ASSET_MIME: application/vnd.microsoft.portable-executable
          - os: macos-15-large
            # This builds for x86
            TARGET: macos
            CMD_BUILD:  >
              pyinstaller tabcmd-mac.spec --clean --noconfirm --distpath ./dist/macos/
            # the extension .app is not allowed as an upload by github
            UPLOAD_FILE_NAME: tabcmd-x86.app.tar
            # these two names must match the output defined in tabcmd-mac.spec
            OUT_FILE_NAME: tabcmd.app
            APP_BINARY_FILE_NAME: tabcmd
            ASSET_MIME: application/zip
          - os: macos-latest
            # This must match the value set in tabcmd-mac.spec for the output folder
            TARGET: macos
            CMD_BUILD:  >
              pyinstaller tabcmd-mac.spec --clean --noconfirm --distpath ./dist/macos/
            UPLOAD_FILE_NAME: tabcmd_arm64.app.tar
            OUT_FILE_NAME: tabcmd.app
            APP_BINARY_FILE_NAME: tabcmd
            ASSET_MIME: application/zip
          - os: ubuntu-latest
            TARGET: ubuntu
          # https://stackoverflow.com/questions/31259856
          # /how-to-create-an-executable-file-for-linux-machine-using-pyinstaller
            CMD_BUILD: >
              pyinstaller --clean -y --distpath ./dist/ubuntu tabcmd-linux.spec &&
              chown -R --reference=. ./dist/ubuntu
            OUT_FILE_NAME: tabcmd
            UPLOAD_FILE_NAME: tabcmd

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.12

    - name: Install dependencies and build
      run: |
        python --version
        python -m pip install --upgrade pip
        python -m pip install --upgrade build
        pip install .[versioning]
        doit version
        pip install .[localize]
        doit localize
        pip install .
        python -m build
        pip install .[package]

    - name: Package with pyinstaller for ${{matrix.TARGET}}
      run: ${{matrix.CMD_BUILD}}

    - name: Validate package for ${{matrix.TARGET}}
      if: matrix.TARGET != 'macos'
      run: ./dist/${{ matrix.TARGET }}/${{matrix.OUT_FILE_NAME}}

    - name: Validate package for Mac
      if: matrix.TARGET == 'macos'
      run: ./dist/${{ matrix.TARGET }}/${{ matrix.OUT_FILE_NAME }}/Contents/MacOS/${{ matrix.APP_BINARY_FILE_NAME }}

    # -v checks the bundled version file. The login probe checks that requests/urllib3/certifi are bundled:
    # a closed port must fail with a connection error, not an import error.
    - name: Smoke test package for ${{matrix.TARGET}}
      shell: bash
      env:
        TARGET: ${{ matrix.TARGET }}
        OUT_FILE_NAME: ${{ matrix.OUT_FILE_NAME }}
        APP_BINARY_FILE_NAME: ${{ matrix.APP_BINARY_FILE_NAME }}
      run: |
        case "$TARGET" in
          macos) BIN="./dist/macos/$OUT_FILE_NAME/Contents/MacOS/$APP_BINARY_FILE_NAME" ;;
          *) BIN="./dist/$TARGET/$OUT_FILE_NAME" ;;
        esac
        "$BIN" -v
        if out=$("$BIN" login -s https://localhost:1 -u a -p b --no-certcheck 2>&1); then
          echo "$out"
          echo "login to a closed port unexpectedly succeeded"
          exit 1
        fi
        echo "$out"
        if echo "$out" | grep -Eq "ImportError|ModuleNotFoundError|Unhandled exception"; then
          echo "packaged binary failed with an import error"
          exit 1
        fi
        echo "$out" | grep -q "Max retries exceeded" || { echo "expected a connection error from requests"; exit 1; }

    - name: Tar app bundle for Mac
      if: matrix.TARGET == 'macos'
      run: |
        rm -f dist/${{ matrix.TARGET }}/${{ matrix.APP_BINARY_FILE_NAME }}
        cd dist/${{ matrix.TARGET }}
        tar -cvf ${{ matrix.UPLOAD_FILE_NAME }} ${{ matrix.OUT_FILE_NAME }}


    # UPLOAD_FILE_NAME distinguishes the two macOS artifacts (x86 vs arm64);
    # the shared artifact name `tabcmd-macos` would otherwise collide and each
    # upload would clobber the other in the artifact store.
    - name: Upload build artifact for ${{ matrix.TARGET }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.UPLOAD_FILE_NAME }}
        path: ./dist/${{ matrix.TARGET }}/${{ matrix.UPLOAD_FILE_NAME }}

  # Attach the built binaries to the target GitHub release. Split into its own
  # job so we can gate it behind the `release` environment: a required-reviewer
  # protection on that environment means publishing a release triggers a build,
  # but only an approved reviewer can actually attach binaries to that release.
  # The workflow pauses at this job until a reviewer clicks Approve. The same
  # approval releases publish_pypi, which uses the same environment.
  #
  # `needs: buildexe` waits for ALL matrix legs to succeed. If any leg fails
  # this job is skipped (default behavior with no `if: always()`), so a partial
  # release upload where e.g. macOS is missing is never possible.
  upload_to_release:
    name: Attach build artifacts to release
    needs: buildexe
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
    # download-artifact versions independently of upload-artifact; v7 reads the
    # zipped artifacts that upload-artifact@v7 produces by default
    - name: Download all build artifacts
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        path: artifacts/

    # Resolve the release tag, in order of preference: the release event's
    # tag_name, the workflow_dispatch release_tag input, then github.ref_name
    # when the run was dispatched from a tag ref. A dispatch from a branch
    # with no release_tag fails fast rather than treating the branch name as
    # a tag, and an empty result never reaches the upload steps.
    - name: Resolve release tag
      id: tag
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        INPUT_TAG: ${{ inputs.release_tag }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        TAG="$RELEASE_TAG"
        if [ -z "$TAG" ]; then
          TAG="$INPUT_TAG"
        fi
        if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
          TAG="$REF_NAME"
        fi
        if [ -z "$TAG" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "::error::workflow_dispatch from $REF_TYPE '$REF_NAME' has no release_tag input; pass -f release_tag=<tag> or dispatch with --ref <tag>"
          exit 1
        fi
        if [ -z "$TAG" ]; then
          echo "::error::No release tag resolvable (event=$EVENT_NAME, release.tag_name empty, release_tag input empty, ref_type=$REF_TYPE)"
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Resolved release tag: $TAG"

    - name: Upload tabcmd.exe (Windows) to release
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        asset_name: tabcmd.exe
        file: artifacts/tabcmd.exe/tabcmd.exe
        tag: ${{ steps.tag.outputs.tag }}
        overwrite: true

    - name: Upload tabcmd (Ubuntu) to release
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        asset_name: tabcmd
        file: artifacts/tabcmd/tabcmd
        tag: ${{ steps.tag.outputs.tag }}
        overwrite: true

    - name: Upload tabcmd-x86.app.tar (macOS x86) to release
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        asset_name: tabcmd-x86.app.tar
        file: artifacts/tabcmd-x86.app.tar/tabcmd-x86.app.tar
        tag: ${{ steps.tag.outputs.tag }}
        overwrite: true

    - name: Upload tabcmd_arm64.app.tar (macOS ARM64) to release
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        asset_name: tabcmd_arm64.app.tar
        file: artifacts/tabcmd_arm64.app.tar/tabcmd_arm64.app.tar
        tag: ${{ steps.tag.outputs.tag }}
        overwrite: true

  # The Python distribution files. Built before the approval gate, so the reviewer
  # approves a build that already succeeded.
  build_dist:
    name: Build wheel and sdist
    if: ${{ github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'pypi' || inputs.target == 'test-pypi' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.12

    - name: Build dist files
      run: |
        python --version
        python -m pip install --upgrade pip
        python -m pip install --upgrade build
        pip install .[versioning]
        doit version
        pip install .[localize]
        doit localize
        pip install .
        python -m build

    - name: Upload dist files
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-dist
        path: dist/

  # Upload to PyPI. Same `release` environment as upload_to_release, so one approval covers both.
  # Runs only when the executables built too (or were not requested), so a release never
  # reaches PyPI while a binary build is broken.
  publish_pypi:
    name: Publish to PyPI
    needs: [build_dist, buildexe]
    if: >-
      ${{ !cancelled()
      && needs.build_dist.result == 'success'
      && (needs.buildexe.result == 'success' || needs.buildexe.result == 'skipped')
      && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'pypi') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
    - name: Download dist files
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: python-dist
        path: dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (was @release/v1), license BSD-2
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

  # Manual only. Uploads the same files to Test PyPI. No environment, so no approval.
  test_pypi:
    name: Publish to Test PyPI
    needs: build_dist
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'test-pypi' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Download dist files
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: python-dist
        path: dist/

    - name: Publish distribution 📦 to Test PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (was @release/v1), license BSD-2
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository_url: https://test.pypi.org/legacy/
