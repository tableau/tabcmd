name: Package-and-Upload

# Pyinstaller requires that executables for each OS are built on that OS
# This action is intended to build on each of the supported OS's: mac (x86 and arm), windows, linux.
# and then upload all four files to a new release

# reference material:
# https://data-dive.com/multi-os-deployment-in-cloud-using-pyinstaller-and-github-actions
# https://anshumanfauzdar.medium.com/using-github-actions-to-bundle-python-application-into-a-single-package-and-automatic-release-834bd42e0670

on:
  release:
    types: [published]
  # Manual repair path for a published release. The release tag is resolved from
  # the release event, then inputs.release_tag, then github.ref_name when
  # dispatched at a tag ref. Don't dispatch for a draft release: the upload step
  # finds the release by tag, drafts can't be found that way, and the action then
  # creates a second release for the same tag.
  # There is deliberately no `push: tags` trigger: release-on-merge.yml pushes a
  # tag on every merge to main, and a build should only run once a release is published.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach binaries to. Required when dispatching from a branch rather than a tag ref.'
        required: false
        type: string

concurrency:
  group: package-${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:

  buildexe:
    name: Build executables
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            TARGET: windows
            CMD_BUILD: >
              pyinstaller tabcmd-windows.spec --clean --noconfirm --distpath ./dist/windows
            UPLOAD_FILE_NAME: tabcmd.exe
            OUT_FILE_NAME: tabcmd.exe
            ASSET_MIME: application/vnd.microsoft.portable-executable
          - os: macos-14-large
            # This builds for x86
            TARGET: macos
            CMD_BUILD:  >
              pyinstaller tabcmd-mac.spec --clean --noconfirm --distpath ./dist/macos/
            # the extension .app is not allowed as an upload by github
            UPLOAD_FILE_NAME: tabcmd-x86.app.tar
            # these two names must match the output defined in tabcmd-mac.spec
            OUT_FILE_NAME: tabcmd.app
            APP_BINARY_FILE_NAME: tabcmd
            ASSET_MIME: application/zip
          - os: macos-latest
            # This must match the value set in tabcmd-mac.spec for the output folder
            TARGET: macos
            CMD_BUILD:  >
              pyinstaller tabcmd-mac.spec --clean --noconfirm --distpath ./dist/macos/
            UPLOAD_FILE_NAME: tabcmd_arm64.app.tar
            OUT_FILE_NAME: tabcmd.app
            APP_BINARY_FILE_NAME: tabcmd
            ASSET_MIME: application/zip
          - os: ubuntu-latest
            TARGET: ubuntu
          # https://stackoverflow.com/questions/31259856
          # /how-to-create-an-executable-file-for-linux-machine-using-pyinstaller
            CMD_BUILD: >
              pyinstaller --clean -y --distpath ./dist/ubuntu tabcmd-linux.spec &&
              chown -R --reference=. ./dist/ubuntu
            OUT_FILE_NAME: tabcmd
            UPLOAD_FILE_NAME: tabcmd

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: 3.12

    - name: Install dependencies and build
      run: |
        python --version
        python -m pip install --upgrade pip
        python -m pip install --upgrade build
        pip install .[versioning]
        doit version
        pip install .
        python -m build
        pip install .[package]

    - name: Package with pyinstaller for ${{matrix.TARGET}}
      run: ${{matrix.CMD_BUILD}}

    - name: Validate package for ${{matrix.TARGET}}
      if: matrix.TARGET != 'macos'
      run: ./dist/${{ matrix.TARGET }}/${{matrix.OUT_FILE_NAME}}

    - name: Validate package for Mac
      if: matrix.TARGET == 'macos'
      run: ./dist/${{ matrix.TARGET }}/${{ matrix.OUT_FILE_NAME }}/Contents/MacOS/${{ matrix.APP_BINARY_FILE_NAME }}

    - name: Tar app bundle for Mac
      if: matrix.TARGET == 'macos'
      run: |
        rm -f dist/${{ matrix.TARGET }}/${{ matrix.APP_BINARY_FILE_NAME }}
        cd dist/${{ matrix.TARGET }}
        tar -cvf ${{ matrix.UPLOAD_FILE_NAME }} ${{ matrix.OUT_FILE_NAME }}


    # UPLOAD_FILE_NAME distinguishes the two macOS artifacts (x86 vs arm64);
    # the shared artifact name `tabcmd-macos` would otherwise collide and each
    # upload would clobber the other in the artifact store.
    - name: Upload build artifact for ${{ matrix.TARGET }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.UPLOAD_FILE_NAME }}
        path: ./dist/${{ matrix.TARGET }}/${{ matrix.UPLOAD_FILE_NAME }}

  # Attach the built binaries to the target GitHub release. Split into its own
  # job so we can gate it behind the `release` environment: a required-reviewer
  # protection on that environment means publishing a release triggers a build,
  # but only an approved reviewer can actually attach binaries to that release.
  # The workflow pauses at this job until a reviewer clicks Approve.
  #
  # `needs: buildexe` waits for ALL matrix legs to succeed. If any leg fails
  # this job is skipped (default behavior with no `if: always()`), so a partial
  # release upload where e.g. macOS is missing is never possible.
  upload_to_release:
    name: Attach build artifacts to release
    needs: buildexe
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
    # download-artifact versions independently of upload-artifact; v7 reads the
    # zipped artifacts that upload-artifact@v7 produces by default
    - name: Download all build artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts/

    # Resolve the release tag, in order of preference: the release event's
    # tag_name, the workflow_dispatch release_tag input, then github.ref_name
    # when the run was dispatched from a tag ref. A dispatch from a branch
    # with no release_tag fails fast rather than treating the branch name as
    # a tag, and an empty result never reaches the upload steps.
    - name: Resolve release tag
      id: tag
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        INPUT_TAG: ${{ inputs.release_tag }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        TAG="$RELEASE_TAG"
        if [ -z "$TAG" ]; then
          TAG="$INPUT_TAG"
        fi
        if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
          TAG="$REF_NAME"
        fi
        if [ -z "$TAG" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "::error::workflow_dispatch from $REF_TYPE '$REF_NAME' has no release_tag input; pass -f release_tag=<tag> or dispatch with --ref <tag>"
          exit 1
        fi
        if [ -z "$TAG" ]; then
          echo "::error::No release tag resolvable (event=$EVENT_NAME, release.tag_name empty, release_tag input empty, ref_type=$REF_TYPE)"
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Resolved release tag: $TAG"

    - name: Upload tabcmd.exe (Windows) to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        asset_name: tabcmd.exe
        file: artifacts/tabcmd.exe/tabcmd.exe
        tag: ${{ steps.tag.outputs.tag }}
        overwrite: true

    - name: Upload tabcmd (Ubuntu) to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        asset_name: tabcmd
        file: artifacts/tabcmd/tabcmd
        tag: ${{ steps.tag.outputs.tag }}
        overwrite: true

    - name: Upload tabcmd-x86.app.tar (macOS x86) to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        asset_name: tabcmd-x86.app.tar
        file: artifacts/tabcmd-x86.app.tar/tabcmd-x86.app.tar
        tag: ${{ steps.tag.outputs.tag }}
        overwrite: true

    - name: Upload tabcmd_arm64.app.tar (macOS ARM64) to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        asset_name: tabcmd_arm64.app.tar
        file: artifacts/tabcmd_arm64.app.tar/tabcmd_arm64.app.tar
        tag: ${{ steps.tag.outputs.tag }}
        overwrite: true
